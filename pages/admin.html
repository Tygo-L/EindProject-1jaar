<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style/styleAdmin.css" />
    <title>GrooveSpinners - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik+Mono+One&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "vinyl-brown": "#3E2723",
              "vinyl-cream": "#FFF8E1",
              "vinyl-orange": "#FF8F00",
              "vinyl-ochre": "#F57F17",
              "vinyl-mint": "#A5D6A7",
            },
            fontFamily: {
              retro: ["Press Start 2P", "monospace"],
              mono: ["Rubik Mono One", "monospace"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen text-vinyl-brown">
    <header class="bg-vinyl-cream/90 backdrop-blur-md shadow-lg">
      <div class="container mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-4">
            <div class="vinyl-record w-12 h-12"></div>
            <h1 class="font-retro text-2xl text-vinyl-brown">Admin Panel</h1>
          </div>
          <a href="index.html" class="cassette-btn px-4 py-2 rounded-lg font-mono">
            <i class="fas fa-home mr-2"></i>To Shop
          </a>
        </div>
      </div>
    </header>

    <div class="container mx-auto px-4 py-8">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-vinyl-cream/90 rounded-2xl p-6 text-center">
          <i class="fas fa-compact-disc text-3xl text-vinyl-orange mb-2"></i>
          <h3 class="font-mono text-lg">Total Products</h3>
          <p id="totalProducts" class="text-2xl font-bold text-vinyl-brown">0</p>
        </div>
        <div class="bg-vinyl-cream/90 rounded-2xl p-6 text-center">
          <i class="fas fa-shopping-cart text-3xl text-vinyl-mint mb-2"></i>
          <h3 class="font-mono text-lg">Total Orders</h3>
          <p id="totalOrders" class="text-2xl font-bold text-vinyl-brown">0</p>
        </div>
        <div class="bg-vinyl-cream/90 rounded-2xl p-6 text-center">
          <i class="fas fa-euro-sign text-3xl text-vinyl-ochre mb-2"></i>
          <h3 class="font-mono text-lg">Revenue</h3>
          <p id="totalRevenue" class="text-2xl font-bold text-vinyl-brown">€0</p>
        </div>
        <div class="bg-vinyl-cream/90 rounded-2xl p-6 text-center">
          <i class="fas fa-star text-3xl text-vinyl-orange mb-2"></i>
          <h3 class="font-mono text-lg">Avg. Price</h3>
          <p id="avgPrice" class="text-2xl font-bold text-vinyl-brown">€0</p>
        </div>
      </div>

      <div class="flex flex-wrap gap-4 mb-8">
        <button
          id="addProductBtn"
          class="bg-vinyl-mint hover:bg-vinyl-mint/80 text-vinyl-brown px-6 py-3 rounded-lg font-mono"
        >
          <i class="fas fa-plus mr-2"></i>Add Product
        </button>
        <button
          id="resetDataBtn"
          class="bg-vinyl-orange hover:bg-vinyl-ochre text-white px-6 py-3 rounded-lg font-mono"
        >
          <i class="fas fa-refresh mr-2"></i>Reset to Original
        </button>
        <button id="viewOrdersBtn" class="cassette-btn px-6 py-3 rounded-lg font-mono">
          <i class="fas fa-list mr-2"></i>View Orders
        </button>
        <button id="toggleProductsBtn" class="cassette-btn px-6 py-3 rounded-lg font-mono">
          <i class="fas fa-box-open mr-2"></i>Show/Hide Products
        </button>
      </div>

      <div id="manageProductsSection" class="bg-vinyl-cream/90 rounded-2xl p-6 mb-8">
        <h2 class="font-retro text-xl mb-6">Manage Products</h2>
        <div id="adminProductsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>

      <div id="ordersSection" class="bg-vinyl-cream/90 rounded-2xl p-6 hidden">
        <h2 class="font-retro text-xl mb-6">Recent Orders</h2>
        <div id="ordersList" class="space-y-4"></div>
      </div>
    </div>

    <div id="productFormModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50">
      <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-vinyl-cream rounded-2xl p-8 max-w-2xl w-full max-h-[80vh] overflow-y-auto">
          <div class="flex justify-between items-center mb-6">
            <h3 id="modalTitle" class="font-retro text-2xl text-vinyl-brown">Add Product</h3>
            <button id="closeModal" class="text-vinyl-brown hover:text-vinyl-orange">
              <i class="fas fa-times text-2xl"></i>
            </button>
          </div>
          <form id="productForm" class="space-y-4">
            <input type="hidden" id="productId" />
            <div>
              <label class="block font-mono mb-2">Title</label>
              <input
                type="text"
                id="productTitle"
                required
                class="w-full px-4 py-2 rounded-lg border-2 border-vinyl-orange focus:outline-none focus:border-vinyl-ochre"
              />
            </div>
            <div>
              <label class="block font-mono mb-2">Artist</label>
              <input
                type="text"
                id="productArtist"
                required
                class="w-full px-4 py-2 rounded-lg border-2 border-vinyl-orange focus:outline-none focus:border-vinyl-ochre"
              />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block font-mono mb-2">Genre</label>
                <select
                  id="productGenre"
                  required
                  class="w-full px-4 py-2 rounded-lg border-2 border-vinyl-orange focus:outline-none focus:border-vinyl-ochre"
                >
                  <option value="">Select Genre</option>
                  <option value="Rock">Rock</option>
                  <option value="Metal">Metal</option>
                  <option value="Jazz">Jazz</option>
                  <option value="Blues">Blues</option>
                  <option value="Folk">Folk</option>
                  <option value="Electronic">Electronic</option>
                  <option value="Pop">Pop</option>
                  <option value="Classical">Classical</option>
                </select>
              </div>
              <div>
                <label class="block font-mono mb-2">Year</label>
                <input
                  type="number"
                  id="productYear"
                  required
                  min="1900"
                  max="2024"
                  class="w-full px-4 py-2 rounded-lg border-2 border-vinyl-orange focus:outline-none focus:border-vinyl-ochre"
                />
              </div>
            </div>
            <div>
              <label class="block font-mono mb-2">Price (€)</label>
              <input
                type="number"
                id="productPrice"
                required
                min="0"
                step="0.01"
                class="w-full px-4 py-2 rounded-lg border-2 border-vinyl-orange focus:outline-none focus:border-vinyl-ochre"
              />
            </div>
            <div>
              <label class="block font-mono mb-2">Cover Image URL</label>
              <input
                type="text"
                id="productImage"
                class="w-full px-4 py-2 rounded-lg border-2 border-vinyl-orange focus:outline-none focus:border-vinyl-ochre"
              />
            </div>
            <div>
              <label class="block font-mono mb-2">Description</label>
              <textarea
                id="productDescription"
                rows="3"
                class="w-full px-4 py-2 rounded-lg border-2 border-vinyl-orange focus:outline-none focus:border-vinyl-ochre"
              ></textarea>
            </div>
            <div>
              <label class="block font-mono mb-2">Vinyl Fact</label>
              <input
                type="text"
                id="productFact"
                placeholder="Interesting fact about this record..."
                class="w-full px-4 py-2 rounded-lg border-2 border-vinyl-orange focus:outline-none focus:border-vinyl-ochre"
              />
            </div>
            <div class="flex gap-4 pt-4">
              <button type="button" id="cancelBtn" class="cassette-btn px-6 py-3 rounded-lg font-mono flex-1">
                Cancel
              </button>
              <button
                type="submit"
                class="bg-vinyl-mint hover:bg-vinyl-mint/80 text-vinyl-brown px-6 py-3 rounded-lg font-mono flex-1"
              >
                Save Product
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/products.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
